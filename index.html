<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeAlpha Docker Web Server</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            text-align: center;
            padding: 100px 20px;
            margin: 0;
        }

        .container {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #0875c9;
        }

        p {
            color: #444;
            font-size: 18px;
        }

        .status {
            display: inline-block;
            background: #d8f8df;
            color: #167532;
            padding: 10px 18px;
            border-radius: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Welcome to My Website!</h1>

        <p>My First DevOps Project</p>

        <p>This website is deployed using Docker.</p>

        <div class="status">Web Server Project</div>
    </div>
</body>
</html>
